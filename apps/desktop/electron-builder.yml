appId: com.matricetechnologies.polish
productName: Polish
directories:
  buildResources: resources
  output: release/${version}
files:
  - out/**
  - resources/**
  - "!resources/*.svg"
  - package.json
# The native addon must sit outside the asar to be loadable, and the tray
# icons are read from disk by the OS.
asarUnpack:
  - "**/node_modules/uiohook-napi/**"
  - resources/**
icon: resources/icon.png
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.productivity
  extendInfo:
    NSAppleEventsUsageDescription: Polish copies your selection and pastes the result back.
linux:
  target: AppImage
  category: Utility
