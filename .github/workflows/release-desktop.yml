# Builds the desktop app for Windows and macOS and publishes it as a GitHub
# Release of this repo, which is where installed copies look for updates and
# where the website's download page links to.
#
# Release: bump "version" in apps/desktop/package.json, then push a tag
#   git tag v0.2.0 && git push origin v0.2.0
#
# Publishing uses the workflow's own GITHUB_TOKEN. Optional secrets
# (repository settings → Secrets and variables → Actions):
#   MAC_CERTIFICATE_P12_BASE64   with the four below: a Developer ID
#   MAC_CERTIFICATE_PASSWORD     Application certificate (.p12, base64) and
#   APPLE_ID                     the Apple account that notarizes. Without
#   APPLE_APP_SPECIFIC_PASSWORD  them macOS builds are ad-hoc signed: they run
#   APPLE_TEAM_ID                after a Gatekeeper warning and cannot update
#                                themselves.
#
# Windows signing, either route (without one, SmartScreen shows "Unknown
# publisher" on first install; updates work regardless):
#   Azure Trusted Signing — secrets AZURE_TENANT_ID, AZURE_CLIENT_ID,
#     AZURE_CLIENT_SECRET, and repository variables AZURE_SIGNING_ENDPOINT
#     (e.g. https://weu.codesigning.azure.net), AZURE_SIGNING_ACCOUNT,
#     AZURE_SIGNING_PROFILE, AZURE_SIGNING_PUBLISHER (the certificate's
#     subject name, e.g. "Matrice Technologies").
#   A code-signing certificate — secrets WIN_CSC_LINK (.pfx, base64) and
#     WIN_CSC_KEY_PASSWORD.

name: Release desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Creating and publishing releases.
permissions:
  contents: write

concurrency:
  group: release-desktop
  cancel-in-progress: false

env:
  RELEASES_REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read the version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match apps/desktop/package.json version $version"
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "v$VERSION already exists; uploading into it."
          else
            gh release create "v$VERSION" --repo "$RELEASES_REPO" --draft \
              --title "Polish $VERSION" \
              --notes "Download from https://polish.matricetechnologies.com/download. Installed copies update automatically."
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        # MAIN_VITE_WEB_URL is left unset: release builds sign in through production.
        run: npm run build --workspace @polish/desktop

      - name: Package and upload (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "Signing with Azure Trusted Signing as $AZURE_SIGNING_PUBLISHER."
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
            npx electron-builder --win --publish always \
              -c.win.azureSignOptions.publisherName="$AZURE_SIGNING_PUBLISHER" \
              -c.win.azureSignOptions.endpoint="$AZURE_SIGNING_ENDPOINT" \
              -c.win.azureSignOptions.codeSigningAccountName="$AZURE_SIGNING_ACCOUNT" \
              -c.win.azureSignOptions.certificateProfileName="$AZURE_SIGNING_PROFILE"
          elif [ -n "$WIN_CSC_LINK" ]; then
            echo "Signing with the code-signing certificate."
            npx electron-builder --win --publish always
          else
            echo "::warning::No Windows signing configured: SmartScreen will show 'Unknown publisher' on first install."
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
            npx electron-builder --win --publish always
          fi

      - name: Package and upload (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "Signing with the Developer ID certificate and notarizing."
            npx electron-builder --mac --publish always -c.mac.notarize=true
          else
            echo "::warning::No Apple certificate: ad-hoc signing. This build shows a Gatekeeper warning and cannot auto-update."
            unset CSC_LINK CSC_KEY_PASSWORD
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --publish always -c.mac.identity=-
          fi

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v$VERSION" --repo "$RELEASES_REPO" --draft=false --latest
